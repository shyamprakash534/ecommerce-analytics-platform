name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m py_compile app.py
      - name: Smoke test data generation
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import app
          with tempfile.TemporaryDirectory() as d:
              app.CLEAN = Path(d) / 'cleaned'
              app.build_data()
              required = ['geography.csv', 'categories.csv', 'products.csv', 'customers.csv', 'orders.csv', 'order_items.csv']
              for name in required:
                  path = app.CLEAN / name
                  assert path.exists() and path.stat().st_size > 0, f'Missing generated {name}'
          print('data generation smoke test passed')
          PY
